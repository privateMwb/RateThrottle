<svg width="1200" height="280" viewBox="0 0 1200 280" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="RateThrottle" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E140A"/>
      <stop offset="100%" stop-color="#07090A"/>
    </linearGradient>
    <linearGradient id="titleGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A3E635"/>
      <stop offset="100%" stop-color="#D946EF"/>
    </linearGradient>
    <linearGradient id="lineGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A3E635" stop-opacity="0"/>
      <stop offset="50%" stop-color="#C154D8" stop-opacity="1"/>
      <stop offset="100%" stop-color="#D946EF" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#14160F" stroke-width="1"/>
    </pattern>
    <radialGradient id="fade" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#07090A" stop-opacity="0"/>
      <stop offset="100%" stop-color="#07090A" stop-opacity="1"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="280" fill="url(#bg)"/>
  <rect width="1200" height="280" fill="url(#grid)"/>
  <rect width="1200" height="280" fill="url(#fade)"/>

  <g transform="translate(136,102)" fill="none" stroke="#A3E635" stroke-width="1.6" opacity="0.65" stroke-linecap="round">
    <path d="M2 26 A12 12 0 0 1 26 26"/>
    <line x1="14" y1="24" x2="21" y2="9"/>
    <circle cx="14" cy="24" r="2" fill="#A3E635" stroke="none"/>
  </g>
  <g transform="translate(1036,102)" fill="none" stroke="#D946EF" stroke-width="1.6" opacity="0.65" stroke-linecap="round">
    <path d="M2 26 A12 12 0 0 1 26 26"/>
    <line x1="14" y1="24" x2="7" y2="9"/>
    <circle cx="14" cy="24" r="2" fill="#D946EF" stroke="none"/>
  </g>

  <text x="600" y="155" text-anchor="middle"
        font-family="'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="72" font-weight="700" letter-spacing="4"
        fill="url(#titleGradient)" filter="url(#glow)">RateThrottle</text>

  <rect x="400" y="185" width="400" height="2" fill="url(#lineGradient)"/>

  <text x="600" y="220" text-anchor="middle"
        font-family="'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="18" letter-spacing="2" fill="#9DAE94">FIXED-WINDOW RATE LIMITING FOR MODERN C++</text>
</svg>
